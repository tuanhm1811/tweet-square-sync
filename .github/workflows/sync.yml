# ============================================================
#  .github/workflows/sync.yml
#
#  TAI SAO JOB TU GOI LAI CHINH NO:
#  Scheduled workflow cua GitHub la best-effort va bi throttle rat nang:
#  cron '5,20,35,50 * * * *' -> con 3 run/ngay (27/08); cron '3 * * * *'
#  -> van chi 5-8 run/ngay, moi run 45 phut => chi phu ~4-5 tieng/ngay.
#  Giai phap:
#   - Moi job: kiem tra 1 lan -> ngu 3 tieng -> tu kich hoat run tiep theo
#     bang workflow_dispatch (GITHUB_TOKEN duoc phep) => ~3 tieng/lan, deu.
#   - Cron 3 tieng/lan giu lai lam DU PHONG neu chuoi tu goi bi dut.
#   - concurrency: chi 1 run chay, 1 run cho; khong bao gio chay chong.
#  Repo public => Actions minutes mien phi khong gioi han.
# ============================================================
name: Tweet to Binance Square

on:
  schedule:
    - cron: '3 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # de job tu goi lai chinh no

concurrency:
  group: tweet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # >>> @username X cua ban (bo dau @) <<<
      TWITTER_USERNAME: "OnchainDataNerd"
      # Nguon doc tweet: "fxtwitter" = MIEN PHI, khong can key X (mac dinh).
      # "xapi" = X API chinh thuc (can 4 secret TWITTER_*, tra phi theo luot).
      SOURCE: "fxtwitter"
      # So lan kiem tra trong 1 job, va thoi gian ngu SAU moi lan kiem tra.
      # 1 x 3 tieng => cu ~3 tieng kiem tra 1 lan. (Muon 1 tieng: "3600".)
      ITERATIONS: "1"
      SLEEP_SECONDS: "10800"
      # (xapi) Neu lich bi bo nhieu gio va account tweet hon 10 bai, X tra ve
      # 10 bai MOI NHAT roi last_id nhay thang len do => mat bai. 100 la tran.
      MAX_RESULTS: "100"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cai thu vien
        run: pip install requests requests-oauthlib

      - name: Dong bo tweet -> Binance Square
        env:
          TWITTER_API_KEY:            ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:         ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:       ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET:      ${{ secrets.TWITTER_ACCESS_SECRET }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          failed=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::Vong $i/$ITERATIONS - $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            # Mot vong loi KHONG lam chet ca job (cac vong sau van chay),
            # nhung duoc ghi nhan de cuoi job bao DO + GitHub gui mail.
            if ! python tweet_to_square_ci.py; then
              failed=$((failed + 1))
              echo "::warning::Vong $i loi (xem log phia tren)."
            fi

            if [[ -n "$(git status --porcelain state/)" ]]; then
              git add -A state/
              git commit -q -m "update last tweet id [skip ci]"
            fi

            # Push ca commit cua vong truoc neu lan do push that bai.
            if [[ -n "$(git log --oneline origin/main..HEAD)" ]]; then
              git pull --rebase -q origin main || true
              git push -q && echo "Da luu state." || echo "[!] Push loi, thu lai vong sau."
            else
              echo "Khong co thay doi state."
            fi

            echo "::endgroup::"

            # Ngu ca sau vong cuoi: run tiep theo chi duoc goi khi ngu xong.
            sleep "$SLEEP_SECONDS"
          done

          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: Tu kich hoat run tiep theo
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml --ref "${{ github.ref_name }}" || echo "[!] Khong tu goi lai duoc, cho cron du phong."

      - name: Bao loi neu co vong that bai
        if: env.failed != '' && env.failed != '0'
        run: |
          echo "::error::${{ env.failed }}/${{ env.ITERATIONS }} vong bi loi - mo buoc 'Dong bo tweet' de xem chi tiet."
          exit 1
