# ============================================================
#  WORKFLOW TAM THOI — chi de LAY LAI key cua CHINH BAN.
#  In secret duoi dang base64 (de lach viec GitHub che *** trong log).
#  >>> XOA FILE NAY + XOA lan chay (run) ngay sau khi lay xong. <<<
# ============================================================
name: Reveal my secrets (temporary)

on:
  workflow_dispatch:   # chi chay tay, khong tu dong

permissions:
  contents: read

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: In secret duoi dang base64
        env:
          TWITTER_API_KEY:       ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:    ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:  ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          echo "Moi ky tu cach nhau 1 dau cach de lach viec che ***. Copy nguyen dong, dan cho Claude."
          echo "API_KEY spaced:       [$(printf %s "$TWITTER_API_KEY"       | sed 's/./& /g')]"
          echo "API_SECRET spaced:    [$(printf %s "$TWITTER_API_SECRET"    | sed 's/./& /g')]"
          echo "ACCESS_TOKEN spaced:  [$(printf %s "$TWITTER_ACCESS_TOKEN"  | sed 's/./& /g')]"
          echo "ACCESS_SECRET spaced: [$(printf %s "$TWITTER_ACCESS_SECRET" | sed 's/./& /g')]"
