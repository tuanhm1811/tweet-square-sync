# ============================================================
#  WORKFLOW TAM THOI — chi de LAY LAI key cua CHINH BAN.
#  In secret duoi dang base64 (de lach viec GitHub che *** trong log).
#  >>> XOA FILE NAY + XOA lan chay (run) ngay sau khi lay xong. <<<
# ============================================================
name: Reveal my secrets (temporary)

on:
  workflow_dispatch:   # chi chay tay, khong tu dong

permissions:
  contents: read

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: In secret duoi dang base64
        env:
          TWITTER_API_KEY:       ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET:    ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN:  ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          echo "Copy toan bo cac dong b64:... duoi day, dan cho Claude / giai ma o may."
          echo "TWITTER_API_KEY b64:       $(printf %s "$TWITTER_API_KEY"       | base64 -w0)"
          echo "TWITTER_API_SECRET b64:    $(printf %s "$TWITTER_API_SECRET"    | base64 -w0)"
          echo "TWITTER_ACCESS_TOKEN b64:  $(printf %s "$TWITTER_ACCESS_TOKEN"  | base64 -w0)"
          echo "TWITTER_ACCESS_SECRET b64: $(printf %s "$TWITTER_ACCESS_SECRET" | base64 -w0)"
